[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-parliament"
version = "0.2.0"
description = "Multi-agent debate for better AI decisions. Research-backed, local-first."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Boris Miscenco" }]
keywords = ["llm", "multi-agent", "debate", "ai", "ollama", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.0",     # also covers Ollama via custom base_url
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "httpx>=0.27",
    "psutil>=5.9",
    "keyring>=24.0",
    "windows-curses>=2.4; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # Unpinned on purpose, as of #30. The upper bound that used to be here held
    # the toolchain at 0.15 while 0.16's wider defaults went unadopted; the
    # code is now clean under them, so new rules arrive as findings to fix
    # rather than as a wall. `extend-select` below is what makes that work.
    "ruff>=0.8",
    # mypy stays pinned where ruff no longer is, and the stub package is part
    # of it: mypy adds checks in minor releases, and typeshed decides what a
    # third-party import resolves to. Pin both, or "mypy is clean" means
    # something different on every machine -- as it already did on #33, where
    # adding the `<2.0` cap moved the resolver from 2.3.1 to 1.20.2 and turned
    # a green job red without a line of source changing.
    "mypy>=1.0,<1.21",
    "types-PyYAML>=6,<7",
]

[project.scripts]
parliament = "parliament.cli:main"

[project.urls]
Homepage = "https://github.com/elarmuzik1993/llm-parliament"
Issues = "https://github.com/elarmuzik1993/llm-parliament/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/parliament"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".cursor",
  "*.code-workspace",
  "docs/superpowers",
  ".github",
  "AGENTS.md",
  "CLAUDE.md",
  "GEMINI.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Neither rule is in ruff's default set, so nothing enforced either before.
# B904: `ruff check .` was green while ten `raise`s inside `except` blocks
# discarded the error that caused them. Enforcing it is what stops an
# eleventh. I: import sorting, so the order stops being a matter of taste.
#
# `extend-select`, not `select`: this adds both rules to whatever ruff
# enforces by default rather than replacing it. `select = ["B904", "I"]` would
# pin the rule set to the four families ruff 0.8 defaulted to, silencing
# everything a newer ruff has learned since. Now that #30 has lifted the
# version pin, that is the whole point: a newer ruff's rules show up as
# findings to triage, not as silence.
extend-select = ["B904", "I"]

# BLE001 (blind `except Exception`) is ignored project-wide rather than
# suppressed at 18 separate sites. Every one of them is a deliberate boundary
# guard: curses and Rich rendering that must not take down a running TUI, and
# keyring helpers that must treat any backend failure as "no keyring" (#58 is
# what happens when that guard is too narrow, not too wide). A per-site noqa
# on all 18 would be noise that says nothing; the shape is intentional and
# belongs in one place with the reason attached.
#
# This is a statement about boundary code, not a licence to swallow errors
# anywhere. Inside the debate path, exceptions are typed and handled -- see
# providers/errors.py and the degraded-member handling in procedures/.
ignore = ["BLE001"]

[tool.mypy]
# Pin the interpreter the gate checks against, for the same reason the tool
# itself is pinned: typeshed is version-dependent, so an unpinned
# `python_version` means mypy reports whatever the contributor's default
# interpreter implies. 3.14's typeshed, for instance, has dropped
# `asyncio.WindowsSelectorEventLoopPolicy`. Matches `[tool.ruff]
# target-version` and `requires-python`.
python_version = "3.11"
ignore_missing_imports = true
